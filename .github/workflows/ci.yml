name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: AsyncBLE

jobs:
  build-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Simulator names drift between runner images, so pick whatever iPhone is installed.
      # Select by UDID, not by name: names like "iPhone SE (3rd generation)" carry a
      # parenthesised suffix that is part of the name, and trimming at the "(" produces
      # an "iPhone SE" that xcodebuild cannot resolve.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | tail -1)
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$DESTINATION"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$DESTINATION"

  example:
    name: Build example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Same UDID-not-name reasoning as the build-test job above.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | tail -1)
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      # The example references the package by relative path, so this also proves the library
      # still integrates the way a consumer would integrate it — not just that it compiles.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Example/AsyncBLEExample.xcodeproj \
            -scheme AsyncBLEExample \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned: `brew install swiftlint` tracks latest, so a SwiftLint release could turn
      # this job red without a commit touching the repo.
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
        run: |
          curl -sSfL -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q portable_swiftlint.zip -d swiftlint-bin
          echo "$PWD/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Show SwiftLint version
        run: swiftlint version

      - name: Lint
        run: swiftlint lint --strict
